packages:
  - path: "github.com/coveninja/cove/internal/tmdb"
    output_path: "web/src/lib/types/tmdb.ts"
  - path: "github.com/coveninja/cove/internal/addons"
    output_path: "web/src/lib/types/addons.ts"
  - path: "github.com/coveninja/cove/internal/player"
    output_path: "web/src/lib/types/player.ts"
  - path: "github.com/coveninja/cove/internal/settings"
    output_path: "web/src/lib/types/settings.ts"
    type_mappings:
      time.Time: "string"   # ISO 8601; tygo's default, listed here for clarity
  - path: "github.com/coveninja/cove/internal/library"
    output_path: "web/src/lib/types/library.ts"
    type_mappings:
      time.Time: "string"   # ISO 8601; tygo's default, listed here for clarity
  - path: "github.com/coveninja/cove/internal/nuvio"
    output_path: "web/src/lib/types/nuvio.ts"
    type_mappings:
      time.Time: "string"   # ISO 8601; tygo's default, listed here for clarity
  - path: "github.com/coveninja/cove/internal/activity"
    output_path: "web/src/lib/types/activity.ts"
    # LibraryLookup (an internal test-injection interface) generates as `any`.
    frontmatter: "/* eslint-disable @typescript-eslint/no-explicit-any */"
    type_mappings:
      time.Time: "string"   # ISO 8601; tygo's default, listed here for clarity
  - path: "github.com/coveninja/cove/internal/profiles"
    output_path: "web/src/lib/types/profiles.ts"
  - path: "github.com/coveninja/cove/internal/updater"
    output_path: "web/src/lib/types/updater.ts"
  - path: "github.com/coveninja/cove/internal/calendar"
    output_path: "web/src/lib/types/calendar.ts"