app-id: io.github.coveninja.Cove
# Compose Desktop ships a bundled JRE via jpackage createDistributable, so no
# Java SDK extension is needed. org.freedesktop.Platform provides glibc and the
# essential system libs the JVM and libmpv need at runtime.
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: cove

# Permissions needed for a network media streaming + video player app.
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  # Discord's documented local RPC sockets. Each name is granted narrowly;
  # exposing all of xdg-run would include unrelated application sockets.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/discord-ipc-1
  - --filesystem=xdg-run/discord-ipc-2
  - --filesystem=xdg-run/discord-ipc-3
  - --filesystem=xdg-run/discord-ipc-4
  - --filesystem=xdg-run/discord-ipc-5
  - --filesystem=xdg-run/discord-ipc-6
  - --filesystem=xdg-run/discord-ipc-7
  - --filesystem=xdg-run/discord-ipc-8
  - --filesystem=xdg-run/discord-ipc-9

modules:
  # libass: subtitle rendering for mpv
  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: '0.17.3'

  # nv-codec-headers: the API FFmpeg uses to reach NVIDIA's hardware decoder.
  # Headers only, needed at build time and cleaned out of the bundle; the CUDA and
  # NVDEC libraries themselves come at runtime from the org.freedesktop.Platform.GL.nvidia
  # extension Flatpak installs to match the host driver. Without this, NVIDIA users
  # decoded every film on the CPU. The 12.0 series loads against the widest range of
  # drivers (520 and later) and is all NVDEC needs; FFmpeg 7.1 accepts it.
  - name: nv-codec-headers
    buildsystem: simple
    build-commands:
      - make PREFIX=/app install
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://github.com/FFmpeg/nv-codec-headers.git
        tag: n12.0.16.1
        commit: 451da99614412a7f9526ef301a5ee0c7a6f9ad76

  # ffmpeg: audio/video decoding for mpv.
  # Built with GPL so libass can be enabled.
  # no-autogen: ffmpeg ships its own ./configure (not autoconf-generated).
  # ffnvcodec and nvdec are named rather than left to autodetection so a missing
  # header fails the build instead of quietly shipping without NVIDIA decoding.
  - name: ffmpeg
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-programs
      - --disable-debug
      - --enable-gpl
      - --enable-version3
      - --enable-libass
      - --enable-ffnvcodec
      - --enable-nvdec
    build-options:
      no-debuginfo: true
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n7.1

  # libplacebo: GPU shader / rendering library required by mpv >= 0.37.0.
  # Vulkan disabled to avoid pulling in glslang/SPIRV-Tools.
  # No -Dlibdir here or on mpv: flatpak-builder already passes --libdir, which
  # keeps the .pc files in /app/lib/pkgconfig, and the SDK's meson (since 24.08) refuses
  # to be given both ("Got argument libdir as both -Dlibdir and --libdir").
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dtests=false
      - -Ddemos=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.349.0

  # LuaJIT: gives mpv its Lua scripting, which is what the ytdl hook is. Without
  # it mpv has no ytdl option and trailers on YouTube cannot play. Flathub's
  # shared-modules recipe; only the library stays in the bundle.
  - name: luajit
    no-autogen: true
    make-args:
      - BUILDMODE=dynamic
      - PREFIX=${FLATPAK_DEST}
    make-install-args:
      - PREFIX=${FLATPAK_DEST}
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: git
        url: https://github.com/openresty/luajit2.git
        tag: v2.1-20260724
        commit: 982cd8323eafd8604a9e5f2a916aa50b9f67d9ed

  # mpv: video player library used by the Compose Desktop app (via JNA).
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dbuild-date=false
      - -Dvapoursynth=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.38.0

  # cove: Compose Desktop app image with the Kotlin backend in-process.
  # It is pre-built in CI before flatpak-builder runs. The Compose app image
  # (compose-app/Cove/) includes its own
  # bundled JRE produced by jpackage createDistributable — no Java runtime
  # extension or system JDK is required inside the sandbox.
  - name: cove
    buildsystem: simple
    build-commands:
      # Compose Desktop app image (pre-built, includes bundled JRE).
      # compose-app/Cove/ is populated by the CI package job from
      # app/desktop/build/compose/binaries/main/app/Cove/ before flatpak-builder
      # runs. The jpackage launcher (bin/Cove) finds the bundled JRE via a
      # relative path (../lib/runtime) so the structure must be kept intact.
      - mkdir -p /app/lib/cove
      - cp -r compose-app/Cove /app/lib/cove/Cove
      - chmod -R a+rX /app/lib/cove/Cove
      - chmod +x /app/lib/cove/Cove/bin/Cove

      # Stable launcher for the bundled app image.
      - install -Dm755 flatpak/cove.sh /app/bin/cove

      # Icon (SVG scales better than PNG for HiDPI)
      - install -Dm644 packaging/icons/cove.svg
          /app/share/icons/hicolor/scalable/apps/io.github.coveninja.Cove.svg

      # Desktop entry and AppStream metadata
      - install -Dm644 flatpak/io.github.coveninja.Cove.desktop
          /app/share/applications/io.github.coveninja.Cove.desktop
      - install -Dm644 flatpak/io.github.coveninja.Cove.metainfo.xml
          /app/share/metainfo/io.github.coveninja.Cove.metainfo.xml

    sources:
      # Whole repo for metadata and packaging assets.
      - type: dir
        path: ..
        skip:
          - .env
          - .git
          - .flatpak-builder
          - node_modules
          - cove-linux-amd64.flatpak
          - app/desktop/build
      # Pre-built Compose Desktop distributable (populated by CI step
      # "Stage Compose app for Flatpak" before flatpak-builder runs).
      - type: dir
        path: ../compose-app
        dest: compose-app
