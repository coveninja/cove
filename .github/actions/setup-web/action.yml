name: Set up Node and install web dependencies
description: >
  Installs Node.js with npm cache enabled and runs npm ci in the web/
  directory. Does not perform a checkout — call actions/checkout separately
  before this action when needed.

inputs:
  node-version:
    description: Node.js version to install.
    default: '22'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Install web dependencies
      shell: bash
      working-directory: web
      run: npm ci
