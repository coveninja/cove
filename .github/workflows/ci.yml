name: CI checks

on:
  push:
    # Tags are fully built by release.yml; avoid duplicating the same work here.
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate website documentation
        run: make test-site-docs
      - name: Test release-note filtering
        run: make test-release-notes
      # Rehearse tag-only packaging and signing contracts with a throwaway key.
      - name: Rehearse the release workflow
        run: make test-release
      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Run actionlint
        run: /tmp/actionlint -color

  kotlin:
    name: Kotlin desktop/mobile build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install libmpv
        # Desktop tests load libmpv through JNA; the wrapper bounds transient apt stalls.
        timeout-minutes: 10
        run: scripts/apt-install.sh libmpv-dev
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build and test
        run: >-
          scripts/gradle-retry.sh
          :shared:build
          :backend:build
          :ui:build
          :desktop:build
          :mobile:testDebugUnitTest
          :mobile:lintDebug
          :mobile:assembleDebug
          --no-daemon

  macos:
    name: macOS native build and test
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install native mpv build dependencies
        run: brew install mpv meson ninja
      - name: Build libmpv with the CoreAudio hotplug lifetime fix
        run: scripts/build-patched-mpv-macos.sh "$RUNNER_TEMP/cove-mpv"
      - name: Test and build Apple-silicon application
        env:
          COVE_MPV_LIBRARY_DIR: ${{ runner.temp }}/cove-mpv/lib
        run: >-
          scripts/gradle-retry.sh
          :backend:desktopTest
          :ui:desktopTest
          :desktop:test
          :desktop:createDistributable
          --no-daemon
      - name: Verify application bundle
        run: |
          set -euo pipefail
          APP=app/desktop/build/compose/binaries/main/app/Cove.app
          test -x "$APP/Contents/MacOS/Cove"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = io.github.coveninja.Cove
          file "$APP/Contents/MacOS/Cove" | grep -q arm64

  android-smoke:
    name: Android phone launch smoke test
    needs: [kotlin]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the shared mobile UI
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          working-directory: app
          script: |
            ./gradlew :mobile:installDebug --no-daemon
            adb shell am start -S -W -n com.coveninja.cove/.MainActivity
            adb shell pidof com.coveninja.cove

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
