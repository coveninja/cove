name: CI checks

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test release-note filtering
        run: make test-release-notes
      # release.yml only runs on a tag, so its key derivation, packaging and manifest steps
      # are otherwise unexercised until the moment they matter. This rehearses them against a
      # throwaway signing key and checks the results still satisfy the PKGBUILD, the Flatpak
      # manifest, the NSIS script and the Kotlin updater's verifier.
      - name: Rehearse the release workflow
        run: make test-release
      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Run actionlint
        run: /tmp/actionlint -color

  kotlin:
    name: Kotlin desktop/mobile build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install libmpv
        # The desktop app links libmpv in-process through JNA, so the shared
        # library must be present for the JVM to load it at test time.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmpv-dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
      - name: Build and test
        working-directory: app
        run: >-
          ./gradlew
          :shared:build
          :backend:build
          :ui:build
          :desktop:build
          :mobile:testDebugUnitTest
          :mobile:lintDebug
          :mobile:assembleDebug
          --no-daemon

  macos:
    name: macOS native build and test
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install libmpv
        run: brew install mpv
      - name: Test and build Apple-silicon application
        working-directory: app
        run: >-
          ./gradlew
          :backend:desktopTest
          :ui:desktopTest
          :desktop:test
          :desktop:createDistributable
          --no-daemon
      - name: Verify application bundle
        run: |
          set -euo pipefail
          APP=app/desktop/build/compose/binaries/main/app/Cove.app
          test -x "$APP/Contents/MacOS/Cove"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = io.github.coveninja.Cove
          file "$APP/Contents/MacOS/Cove" | grep -q arm64

  android-smoke:
    name: Android phone launch smoke test
    needs: [kotlin]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the shared mobile UI
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          working-directory: app
          script: |
            ./gradlew :mobile:installDebug --no-daemon
            adb shell am start -S -W -n com.coveninja.cove/.MainActivity
            adb shell pidof com.coveninja.cove

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
