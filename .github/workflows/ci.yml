name: CI checks

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test release-note filtering
        run: make test-release-notes
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  go-test:
    name: Go test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: public
            tags: ""
          - variant: supabase
            tags: supabase
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        shell: bash
        env:
          GO_TAGS: ${{ matrix.tags }}
        run: |
          if [ -n "$GO_TAGS" ]; then
            go vet -tags "$GO_TAGS" ./...
          else
            go vet ./...
          fi
      - name: Test with coverage
        shell: bash
        env:
          GO_TAGS: ${{ matrix.tags }}
        run: |
          if [ -n "$GO_TAGS" ]; then
            go test -count=1 -tags "$GO_TAGS" -covermode=atomic -coverprofile="coverage-${{ matrix.variant }}.out" ./...
          else
            go test -count=1 -covermode=atomic -coverprofile="coverage-${{ matrix.variant }}.out" ./...
          fi
          go tool cover -func="coverage-${{ matrix.variant }}.out" | tail -1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-coverage-${{ matrix.variant }}
          path: coverage-${{ matrix.variant }}.out
          if-no-files-found: ignore
      - name: Publish Go coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage-${{ matrix.variant }}.out
          flags: go-${{ matrix.variant }}
          use_oidc: true
          fail_ci_if_error: false

  go-race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: go test -count=1 -race -tags supabase ./...

  go-build:
    name: Go build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            output: cove
          - goos: windows
            output: cove.exe
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Build tagged binary
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
          GOOS: ${{ matrix.goos }}
          OUTPUT: ${{ matrix.output }}
        run: go build -tags supabase -o "$OUTPUT" .

  private-integrations:
    name: Private integration tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COVE_PRIVATE_TOKEN }}
      - uses: ./.github/actions/setup-go
      - name: Verify checked-in Supabase copy
        run: bash scripts/check-private-sync.sh
      - name: Inject private implementations
        run: |
          cp _private/cove-auth/*.go internal/supabase/
          cp _private/cove-discover/*.go internal/discover/
      - run: go test -count=1 -tags supabase,discover ./...
      - run: go vet -tags supabase,discover ./...

  kotlin:
    name: Kotlin build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install libmpv
        # The desktop app links libmpv in-process through JNA, so the shared
        # library must be present for the JVM to load it at test time.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmpv-dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        working-directory: app
        run: ./gradlew build test --no-daemon

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
