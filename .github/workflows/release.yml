name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Create the GitHub release up front with the tagged commit's body (the MSG
  # + linked user-facing fix/feat list that `make patch`/`minor`/`major`
  # writes) as the release notes — the markdown only renders on the release
  # page. The softprops asset-upload steps otherwise create a body-less
  # release. If a
  # package job wins the race and creates the release first, fall back to
  # editing the notes in. softprops preserves an existing body when no body
  # input is given, so later asset uploads don't clobber the notes.
  create-release:
    name: Create release with notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, go, kotlin]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Seed release notes from the tagged commit body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git log -1 --format=%b > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md \
            || gh release edit "$TAG" --notes-file notes.md

  test:
    name: Full tagged Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COVE_PRIVATE_TOKEN }}
      - uses: ./.github/actions/setup-go
        with:
          cache: 'false'

      - name: Test public implementation
        run: go test -count=1 ./...

      - name: Verify and inject private implementations
        run: |
          bash scripts/check-private-sync.sh
          cp _private/cove-auth/*.go internal/supabase/
          cp _private/cove-discover/*.go internal/discover/

      - name: Test release implementation
        run: go test -count=1 -tags supabase,discover ./...

  go:
    name: Go build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COVE_PRIVATE_TOKEN }}
      - uses: ./.github/actions/setup-go
        with:
          cache: 'false'

      - name: Inject private implementations
        shell: bash
        run: |
          cp _private/cove-auth/*.go internal/supabase/
          cp _private/cove-discover/*.go internal/discover/

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -tags supabase,discover -ldflags "-X main.Version=${{ github.ref_name }} -X main.TmdbApiKey=${{ secrets.TMDB_API_KEY }} -X main.SupabaseURL=${{ secrets.SUPABASE_URL }} -X main.SupabaseAnonKey=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} -X main.TraktClientID=${{ secrets.TRAKT_CLIENT_ID }} -X main.TraktClientSecret=${{ secrets.TRAKT_CLIENT_SECRET }}" -o cove .

      - name: Vet
        run: go vet -tags supabase,discover ./...

  kotlin:
    name: Kotlin build and test
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install libmpv
        # The desktop app links libmpv in-process through JNA, so the shared
        # library must be present for the JVM to load it at test time.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmpv-dev

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        working-directory: app
        run: ./gradlew build test --no-daemon

  package:
    name: Package release asset (Flatpak)
    needs: [test, go, kotlin, create-release]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COVE_PRIVATE_TOKEN }}
      - uses: ./.github/actions/setup-go
        with:
          cache: 'false'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install libmpv build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmpv-dev

      - name: Inject private implementations
        run: |
          cp _private/cove-auth/*.go internal/supabase/
          cp _private/cove-discover/*.go internal/discover/

      - name: Build Go backend
        env:
          CGO_ENABLED: '0'
        run: go build -tags supabase,discover -ldflags "-X main.Version=${{ github.ref_name }} -X main.TmdbApiKey=${{ secrets.TMDB_API_KEY }} -X main.SupabaseURL=${{ secrets.SUPABASE_URL }} -X main.SupabaseAnonKey=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} -X main.TraktClientID=${{ secrets.TRAKT_CLIENT_ID }} -X main.TraktClientSecret=${{ secrets.TRAKT_CLIENT_SECRET }}" -o cove .

      # Build the Compose Desktop app image outside the Flatpak sandbox (Gradle
      # requires network for dependency resolution). The jpackage distributable
      # bundles its own JRE so the packaged artifact is self-contained.
      - name: Build Compose Desktop distributable
        working-directory: app
        run: ./gradlew :desktop:createDistributable --no-daemon

      - name: Assemble PKGBUILD tarball
        run: |
          mkdir -p _pkg/bin _pkg/lib/cove _pkg/share/applications \
                   "_pkg/share/icons/hicolor/scalable/apps"

          # Launcher — passes Go backend path to the Compose app launcher
          printf '#!/bin/sh\nexec /usr/lib/cove/Cove/bin/Cove --backend /usr/lib/cove/cove "$@"\n' \
            > _pkg/bin/cove
          chmod +x _pkg/bin/cove

          cp cove _pkg/lib/cove/cove
          # Compose Desktop distributable (includes bundled JRE)
          cp -r app/desktop/build/compose/binaries/main/app/Cove _pkg/lib/cove/Cove
          cp flatpak/io.github.coveninja.Cove.desktop \
             _pkg/share/applications/
          cp packaging/icons/cove.svg \
             "_pkg/share/icons/hicolor/scalable/apps/io.github.coveninja.Cove.svg"

          tar -czf cove-linux-amd64.tar.gz -C _pkg .

      - name: Generate PKGBUILD
        run: |
          PKG_VER="${{ github.ref_name }}"
          PKG_VER="${PKG_VER#v}"
          SHA256=$(sha256sum cove-linux-amd64.tar.gz | cut -d' ' -f1)
          sed -e "s/__VERSION__/${PKG_VER}/" \
              -e "s/__SHA256__/${SHA256}/" \
              packaging/PKGBUILD > PKGBUILD
          printf '%s  cove-linux-amd64.tar.gz' "$SHA256" > cove-linux-amd64.tar.gz.sha256

      - name: Install Flatpak build tools and runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y --noninteractive flathub \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Platform//24.08

      # Copy the Compose distributable to compose-app/ so the Flatpak manifest
      # can reference it as a separate type:dir source without pulling in the
      # entire Gradle build cache.
      - name: Stage Compose app for Flatpak
        run: |
          mkdir -p compose-app
          cp -r app/desktop/build/compose/binaries/main/app/Cove compose-app/

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: cove-linux-amd64.flatpak
          manifest-path: flatpak/io.github.coveninja.Cove.yml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.coveninja.Cove.yml') }}
          upload-artifact: false

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cove-linux-amd64.flatpak
            cove-linux-amd64.tar.gz
            cove-linux-amd64.tar.gz.sha256
            PKGBUILD

  aur-publish:
    name: Publish to AUR
    needs: [package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Arch container gives us makepkg (for --printsrcinfo) without hand-rolling
    # pacman setup on a plain ubuntu runner.
    container: archlinux:base
    steps:
      - name: Install git, openssh, base-devel, create builder user
        run: |
          pacman -Sy --noconfirm git openssh base-devel
          # base-devel's makepkg refuses to run as root; do everything below
          # as an unprivileged user, matching normal Arch usage. Setting up
          # SSH directly in its home dir (rather than as root and copying
          # over) avoids ownership/ordering pitfalls that broke host key
          # verification.
          useradd -m builder

      - name: Set up SSH for AUR (as builder)
        run: |
          install -d -m 700 -o builder -g builder /home/builder/.ssh

          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          chown builder:builder /home/builder/.ssh/aur

          ssh-keyscan -H aur.archlinux.org >> /home/builder/.ssh/known_hosts
          chmod 600 /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/known_hosts

          cat >> /home/builder/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 /home/builder/.ssh/config
          chown builder:builder /home/builder/.ssh/config

      - name: Download generated PKGBUILD from this release, push to AUR (as builder)
        run: |
          # Variables in this command body intentionally expand in builder's shell.
          # shellcheck disable=SC2016
          su builder -c '
            set -e
            cd ~
            curl -L -o PKGBUILD \
              "https://github.com/coveninja/cove/releases/download/${{ github.ref_name }}/PKGBUILD"
            git clone ssh://aur@aur.archlinux.org/cove-bin.git aur-repo
            cp PKGBUILD aur-repo/
            cd aur-repo
            makepkg --printsrcinfo > .SRCINFO
            git config user.name "coveninja-bot"
            git config user.email "actions@github.com"
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo "No changes to push"
            else
              git commit -m "Update to ${{ github.ref_name }}"
              # The AUR SSH endpoint intermittently drops the connection
              # mid-handshake (unrelated to auth/config); retry a few times
              # before failing the job.
              for attempt in 1 2 3 4 5; do
                if git push origin master; then
                  break
                fi
                echo "push attempt $attempt failed, retrying in 15s..."
                sleep 15
                if [ "$attempt" = 5 ]; then
                  echo "git push failed after 5 attempts"
                  exit 1
                fi
              done
            fi
          '

  package-windows:
    name: Package release asset (Windows)
    needs: [test, go, kotlin, create-release]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COVE_PRIVATE_TOKEN }}
      - uses: ./.github/actions/setup-go
        with:
          cache: 'false'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Download mpv DLL (shinchiro)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest)
          ASSET_URL=$(echo "$RESPONSE" \
            | jq -r '.assets[] | select(.name | test("mpv-dev-x86_64.*\\.7z$")) | .browser_download_url' \
            | head -1)
          if [ -z "$ASSET_URL" ]; then
            echo "Failed to find asset; API response:"
            echo "$RESPONSE" | head -c 500
            exit 1
          fi
          echo "Downloading $ASSET_URL"
          curl -L "$ASSET_URL" -o mpv-dev.7z
          7z x mpv-dev.7z -ompv-sdk -y

      - name: Locate mpv DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem mpv-sdk -Filter "mpv-2.dll" -Recurse | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem mpv-sdk -Filter "libmpv-2.dll" -Recurse | Select-Object -First 1 }
          if (-not $dll) { Write-Error "mpv DLL not found in mpv-sdk"; exit 1 }
          "MPV_DLL=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Found mpv DLL: $($dll.FullName)"

      - name: Inject private implementations
        shell: bash
        run: |
          cp _private/cove-auth/*.go internal/supabase/
          cp _private/cove-discover/*.go internal/discover/

      - name: Build Go backend (Windows)
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -tags supabase,discover -ldflags "-X main.Version=${{ github.ref_name }} -X main.TmdbApiKey=${{ secrets.TMDB_API_KEY }} -X main.SupabaseURL=${{ secrets.SUPABASE_URL }} -X main.SupabaseAnonKey=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} -X main.TraktClientID=${{ secrets.TRAKT_CLIENT_ID }} -X main.TraktClientSecret=${{ secrets.TRAKT_CLIENT_SECRET }}" -o cove.exe .

      # Build the Compose Desktop distributable for Windows. jpackage bundles a
      # JRE so the packaged artifact is self-contained; no system Java required
      # at install time.
      - name: Build Compose Desktop distributable (Windows)
        working-directory: app
        run: ./gradlew :desktop:createDistributable --no-daemon

      - name: Assemble staging directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          # Compose Desktop app image (Cove.exe launcher + bundled JRE + app JARs)
          $appDir = "app\desktop\build\compose\binaries\main\app\Cove"
          Copy-Item -Recurse "$appDir\*" staging\
          # Go backend
          Copy-Item cove.exe staging\
          # mpv DLL loaded at runtime via JNA; must be on PATH or in the working
          # directory so JNA can locate it — staging root alongside Cove.exe works.
          Copy-Item "${{ env.MPV_DLL }}" staging\mpv-2.dll

      - name: Sanity-check staged package
        shell: pwsh
        run: |
          $missing = @()
          foreach ($f in @("Cove.exe", "cove.exe", "mpv-2.dll")) {
            if (-not (Test-Path "staging\$f")) { $missing += $f }
          }
          if (-not (Test-Path "staging\runtime")) { $missing += "runtime\" }
          if (-not (Test-Path "staging\app"))     { $missing += "app\" }
          if ($missing) {
            Write-Error ("Staged Windows package is incomplete — missing: " + ($missing -join ", "))
            exit 1
          }

      - name: Create zip (for auto-updater)
        shell: pwsh
        run: |
          Compress-Archive -Path staging/* -DestinationPath cove-windows-amd64.zip

      # The auto-updater downloads this alongside the zip and refuses to
      # extract an archive whose SHA-256 doesn't match (see internal/updater).
      - name: Publish zip checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash cove-windows-amd64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  cove-windows-amd64.zip" | Out-File cove-windows-amd64.zip.sha256 -Encoding ascii -NoNewline

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create NSIS installer
        shell: pwsh
        run: |
          makensis /DVERSION="${{ github.ref_name }}" /DOUTDIR="${{ github.workspace }}" packaging/windows/cove.nsi

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cove-windows-amd64-setup.exe
            cove-windows-amd64.zip
            cove-windows-amd64.zip.sha256
