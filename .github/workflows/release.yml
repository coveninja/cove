name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-key:
    name: Prepare update verification key
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      public_keys: ${{ steps.key.outputs.public_keys }}
      key_id: ${{ steps.key.outputs.key_id }}
    steps:
      - id: key
        name: Derive public key from protected signing key
        env:
          PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY_BASE64 }}
          KEY_ID: ${{ vars.UPDATE_SIGNING_KEY_ID || 'cove-2026-1' }}
          TRUSTED_PUBLIC_KEYS: ${{ vars.UPDATE_TRUSTED_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY" || { echo '::error::UPDATE_SIGNING_KEY_BASE64 is not configured'; exit 1; }
          [[ "$KEY_ID" =~ ^[a-zA-Z0-9._-]{1,64}$ ]] || { echo '::error::Invalid update signing key id'; exit 1; }
          printf '%s' "$PRIVATE_KEY" | tr -d ' \t\r\n' | base64 -d > private.der
          openssl pkey -inform DER -in private.der -pubout -outform DER -out public.der
          PUBLIC=$(base64 -w0 public.der)
          TRUSTED=$(printf '%s' "$TRUSTED_PUBLIC_KEYS" | tr -d ' \t\r\n')
          PUBLIC_KEYS="${TRUSTED:+$TRUSTED,}$KEY_ID=$PUBLIC"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "public_keys=$PUBLIC_KEYS" >> "$GITHUB_OUTPUT"
      - name: Validate client release configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in TMDB_API_KEY SUPABASE_URL SUPABASE_PUBLISHABLE_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET; do
            test -n "${!name}" || { echo "::error::$name is not configured"; exit 1; }
          done

  kotlin:
    name: Kotlin desktop/mobile build and test
    needs: [update-key]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag and source version agree
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"
      - name: Install libmpv
        timeout-minutes: 10
        run: scripts/apt-install.sh libmpv-dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
      - name: Build and test
        env:
          UPDATE_PUBLIC_KEYS: ${{ needs.update-key.outputs.public_keys }}
        run: >-
          scripts/gradle-retry.sh
          :shared:build
          :backend:build
          :ui:build
          :desktop:build
          :mobile:testDebugUnitTest
          :mobile:lintDebug
          :mobile:assembleDebug
          --no-daemon

  package-linux:
    name: Package Linux assets
    needs: [update-key, kotlin]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install libmpv and Flatpak tooling
        timeout-minutes: 20
        run: |
          scripts/apt-install.sh libmpv-dev flatpak flatpak-builder
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y --noninteractive flathub \
            org.freedesktop.Sdk//24.08 org.freedesktop.Platform//24.08
      - name: Build Compose Desktop distributable
        env:
          UPDATE_PUBLIC_KEYS: ${{ needs.update-key.outputs.public_keys }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: scripts/gradle-retry.sh :desktop:createDistributable --no-daemon
      - name: Assemble tarball and PKGBUILD
        run: |
          mkdir -p _pkg/bin _pkg/lib/cove _pkg/share/applications \
                   _pkg/share/icons/hicolor/scalable/apps compose-app
          # libjsig is preloaded so libtorrent's signal handlers chain to the JVM's
          # instead of replacing them — see flatpak/cove.sh for the full reasoning.
          # Without it, the first null dereference after a torrent starts is fatal.
          # The single quotes are deliberate: $JSIG, $LD_PRELOAD and "$@" must reach
          # the generated launcher literally rather than expanding here at build time.
          # shellcheck disable=SC2016
          printf '#!/bin/sh\nJSIG=/usr/lib/cove/Cove/lib/runtime/lib/libjsig.so\n[ -f "$JSIG" ] && export LD_PRELOAD="${JSIG}${LD_PRELOAD:+:$LD_PRELOAD}"\nexec /usr/lib/cove/Cove/bin/Cove "$@"\n' > _pkg/bin/cove
          chmod +x _pkg/bin/cove
          cp -r app/desktop/build/compose/binaries/main/app/Cove _pkg/lib/cove/Cove
          cp -r app/desktop/build/compose/binaries/main/app/Cove compose-app/Cove
          cp flatpak/io.github.coveninja.Cove.desktop _pkg/share/applications/
          cp packaging/icons/cove.svg _pkg/share/icons/hicolor/scalable/apps/io.github.coveninja.Cove.svg
          tar -czf cove-linux-amd64.tar.gz -C _pkg .
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum cove-linux-amd64.tar.gz | cut -d' ' -f1)
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__SHA256__/${SHA256}/" packaging/PKGBUILD > PKGBUILD
          printf '%s  cove-linux-amd64.tar.gz\n' "$SHA256" > cove-linux-amd64.tar.gz.sha256
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: cove-linux-amd64.flatpak
          manifest-path: flatpak/io.github.coveninja.Cove.yml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.coveninja.Cove.yml') }}
          upload-artifact: false
      - name: Checksum Flatpak bundle
        run: sha256sum cove-linux-amd64.flatpak > cove-linux-amd64.flatpak.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          if-no-files-found: error
          path: |
            cove-linux-amd64.flatpak
            cove-linux-amd64.flatpak.sha256
            cove-linux-amd64.tar.gz
            cove-linux-amd64.tar.gz.sha256
            PKGBUILD

  package-windows:
    name: Package Windows assets
    needs: [update-key, kotlin]
    runs-on: windows-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Download mpv DLL
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest)
          ASSET_URL=$(echo "$RESPONSE" | jq -r \
            '.assets[] | select(.name | test("mpv-dev-x86_64.*\\.7z$")) | .browser_download_url' | head -1)
          test -n "$ASSET_URL"
          curl -fL "$ASSET_URL" -o mpv-dev.7z
          7z x mpv-dev.7z -ompv-sdk -y
      - name: Locate mpv DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem mpv-sdk -Filter "mpv-2.dll" -Recurse | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem mpv-sdk -Filter "libmpv-2.dll" -Recurse | Select-Object -First 1 }
          if (-not $dll) { Write-Error "mpv DLL not found"; exit 1 }
          "MPV_DLL=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Compose Desktop distributable
        working-directory: app
        env:
          UPDATE_PUBLIC_KEYS: ${{ needs.update-key.outputs.public_keys }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: ./gradlew :desktop:createDistributable --no-daemon
      - name: Assemble and validate staging directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item -Recurse "app\desktop\build\compose\binaries\main\app\Cove\*" staging\
          Copy-Item "${{ env.MPV_DLL }}" staging\mpv-2.dll
          foreach ($f in @("Cove.exe", "mpv-2.dll", "runtime", "app")) {
            if (-not (Test-Path "staging\$f")) { Write-Error "staging is missing $f"; exit 1 }
          }
      - name: Build installer, portable updater, and portable ZIP
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $nsis /DVERSION="${{ github.ref_name }}" /DOUTDIR="${{ github.workspace }}" packaging/windows/cove.nsi
          & $nsis /DPORTABLE_UPDATE=1 /DVERSION="${{ github.ref_name }}" /DOUTDIR="${{ github.workspace }}" packaging/windows/cove.nsi
          New-Item -ItemType Directory -Force staging-portable | Out-Null
          Copy-Item -Recurse staging\* staging-portable\
          Set-Content staging-portable\.cove-portable -Value "${{ github.ref_name }}" -Encoding ascii
          $portableFiles = Get-ChildItem staging-portable -Force
          # Do NOT rename this back to cove-windows-amd64.zip. The pre-1.0.0 Go updater
          # looked for exactly that name plus a .sha256 sibling, and would happily unpack
          # this archive over a Qt/Go install — replacing cove.exe with the Compose
          # launcher while leaving cove_shell.exe and its restart handshake in place,
          # which yields an install that no longer starts. The new updater never reads
          # this asset (it resolves windows-installer/windows-portable from the signed
          # manifest), so the distinct name is what makes the old updater fail closed.
          Compress-Archive -Path $portableFiles.FullName -DestinationPath cove-windows-amd64-portable.zip
          foreach ($f in @(
            "cove-windows-amd64-setup.exe",
            "cove-windows-amd64-portable-update.exe",
            "cove-windows-amd64-portable.zip"
          )) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $f" | Out-File "$f.sha256" -Encoding ascii -NoNewline
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          if-no-files-found: error
          path: |
            cove-windows-amd64-setup.exe
            cove-windows-amd64-setup.exe.sha256
            cove-windows-amd64-portable-update.exe
            cove-windows-amd64-portable-update.exe.sha256
            cove-windows-amd64-portable.zip
            cove-windows-amd64-portable.zip.sha256

  package-macos:
    name: Package macOS asset (ad-hoc signed)
    needs: [update-key, kotlin]
    runs-on: macos-15
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install native packaging dependencies
        run: brew install mpv dylibbundler
      - name: Build Compose application
        env:
          UPDATE_PUBLIC_KEYS: ${{ needs.update-key.outputs.public_keys }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: scripts/gradle-retry.sh :desktop:createDistributable --no-daemon
      - name: Bundle libmpv and verify native closure
        run: |
          set -euo pipefail
          APP=app/desktop/build/compose/binaries/main/app/Cove.app
          FRAMEWORKS="$APP/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"
          cp "$(brew --prefix mpv)/lib/libmpv.2.dylib" "$FRAMEWORKS/libmpv.2.dylib"
          dylibbundler -of -cd -b -x "$FRAMEWORKS/libmpv.2.dylib" \
            -d "$FRAMEWORKS" -p '@loader_path/'
          # Homebrew's libmpv already carries this rpath. dylibbundler adds it
          # again, and dyld rejects a Mach-O containing duplicate LC_RPATHs.
          while [ "$(otool -l "$FRAMEWORKS/libmpv.2.dylib" \
            | awk '/LC_RPATH/{getline; getline; if ($0 ~ /@loader_path\//) count++} END{print count+0}')" -gt 1 ]; do
            install_name_tool -delete_rpath '@loader_path/' "$FRAMEWORKS/libmpv.2.dylib"
          done
          ln -s libmpv.2.dylib "$FRAMEWORKS/libmpv.dylib"
          for library in "$FRAMEWORKS"/*.dylib; do
            # The first listed path is the dylib's install id, not a dependency.
            external=$(otool -L "$library" | tail -n +3 \
              | awk '{print $1}' \
              | grep -E '^(/opt/homebrew|/usr/local)' || true)
            test -z "$external" || { echo "::error::$library still references $external"; exit 1; }
          done
          # Ad-hoc signatures, NOT Developer ID. arm64 macOS refuses to execute a
          # Mach-O carrying no signature at all, so this is the minimum that runs;
          # it is not a Gatekeeper credential and does not avoid the quarantine
          # prompt. Hardened runtime and entitlements are deliberately omitted:
          # they exist to satisfy notarization, and with no real identity they add
          # only library-validation failure modes. Restoring Developer ID means
          # putting back --options runtime, the entitlements and notarytool
          # together — see docs/UPDATES.md.
          find "$FRAMEWORKS" -type f -name '*.dylib' -print0 \
            | xargs -0 -n1 codesign --force --timestamp=none --sign -
          python3 -c 'import ctypes,sys; ctypes.CDLL(sys.argv[1])' "$FRAMEWORKS/libmpv.2.dylib"
          codesign --force --timestamp=none --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Create DMG
        run: |
          set -euo pipefail
          mkdir dmg-root
          ditto app/desktop/build/compose/binaries/main/app/Cove.app dmg-root/Cove.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Cove -srcfolder dmg-root -ov -format UDZO cove-macos-arm64.dmg
          shasum -a 256 cove-macos-arm64.dmg > cove-macos-arm64.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          if-no-files-found: error
          path: |
            cove-macos-arm64.dmg
            cove-macos-arm64.dmg.sha256

  package-android:
    name: Package Android asset
    needs: [update-key, kotlin]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
      - name: Decode release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo '::error::ANDROID_KEYSTORE_BASE64 is not configured'; exit 1; }
          printf '%s' "$KEYSTORE" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/cove-release.jks"
      - name: Build signed release APK
        env:
          UPDATE_PUBLIC_KEYS: ${{ needs.update-key.outputs.public_keys }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/cove-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: scripts/gradle-retry.sh :mobile:lintDebug :mobile:testDebugUnitTest :mobile:assembleRelease --no-daemon
      - name: Stage and checksum APK
        run: |
          cp app/mobile/build/outputs/apk/release/mobile-release.apk cove-android.apk
          sha256sum cove-android.apk > cove-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          if-no-files-found: error
          path: |
            cove-android.apk
            cove-android.apk.sha256

  publish-release:
    name: Sign manifest and publish complete release
    needs: [update-key, package-linux, package-windows, package-macos, package-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release-assets'
          path: release-assets
          merge-multiple: true
      - name: Generate and sign update manifest
        env:
          PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY_BASE64 }}
          KEY_ID: ${{ needs.update-key.outputs.key_id }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          WIN_SETUP=cove-windows-amd64-setup.exe
          WIN_PORTABLE=cove-windows-amd64-portable-update.exe
          ANDROID=cove-android.apk
          for file in "$WIN_SETUP" "$WIN_PORTABLE" "$ANDROID"; do test -s "release-assets/$file"; done
          jq -n \
            --arg key_id "$KEY_ID" \
            --arg version "$VERSION" \
            --arg release_name "$GITHUB_REF_NAME" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_setup "$WIN_SETUP" \
            --arg win_setup_sha "$(sha256sum "release-assets/$WIN_SETUP" | cut -d' ' -f1)" \
            --argjson win_setup_size "$(stat -c %s "release-assets/$WIN_SETUP")" \
            --arg win_portable "$WIN_PORTABLE" \
            --arg win_portable_sha "$(sha256sum "release-assets/$WIN_PORTABLE" | cut -d' ' -f1)" \
            --argjson win_portable_size "$(stat -c %s "release-assets/$WIN_PORTABLE")" \
            --arg android "$ANDROID" \
            --arg android_sha "$(sha256sum "release-assets/$ANDROID" | cut -d' ' -f1)" \
            --argjson android_size "$(stat -c %s "release-assets/$ANDROID")" \
            '{schema_version:1,key_id:$key_id,version:$version,release_name:$release_name,published_at:$published_at,assets:[
              {target:"windows-installer",name:$win_setup,size_bytes:$win_setup_size,sha256:$win_setup_sha},
              {target:"windows-portable",name:$win_portable,size_bytes:$win_portable_size,sha256:$win_portable_sha},
              {target:"android",name:$android,size_bytes:$android_size,sha256:$android_sha}
            ]}' > cove-update-manifest-v1.json
          printf '%s' "$PRIVATE_KEY" | tr -d ' \t\r\n' | base64 -d > private.der
          openssl pkeyutl -sign -rawin -inkey private.der -keyform DER \
            -in cove-update-manifest-v1.json -out manifest-signature.bin
          base64 -w0 manifest-signature.bin > cove-update-manifest-v1.json.sig
          openssl pkey -inform DER -in private.der -pubout -outform DER -out public.der
          openssl pkeyutl -verify -rawin -pubin -inkey public.der -keyform DER \
            -in cove-update-manifest-v1.json -sigfile manifest-signature.bin
      - name: Verify human checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; publish a new patch tag instead of replacing assets."
            exit 1
          fi
          git log -1 --format=%b > notes.md
          cleanup_failed_draft() {
            gh release delete "$GITHUB_REF_NAME" --yes >/dev/null 2>&1 || true
          }
          trap cleanup_failed_draft ERR
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" \
            --notes-file notes.md release-assets/* \
            cove-update-manifest-v1.json cove-update-manifest-v1.json.sig
          gh release edit "$GITHUB_REF_NAME" --draft=false
          trap - ERR

  aur-publish:
    name: Publish to AUR
    needs: [publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    container: archlinux:base
    steps:
      - name: Install tools and create builder user
        run: |
          pacman -Sy --noconfirm git openssh base-devel curl
          useradd -m builder
      - name: Configure AUR key
        env:
          # Via env rather than inline ${{ }}: the key never becomes part of the script text,
          # so nothing in it can be read as shell syntax.
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          # printf '%s' wrote the key with no trailing newline, and OpenSSH rejects a private
          # key whose final -----END----- line is unterminated with exactly the message the
          # v1.0.0 release died on: 'Load key ".../aur": invalid format'. The GitHub secrets
          # UI strips the trailing newline on save, so the stored value never carries one.
          # A doubled newline is harmless, so this is safe whichever way the secret was saved.
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          chown builder:builder /home/builder/.ssh/aur
          ssh-keyscan -H aur.archlinux.org > /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n  StrictHostKeyChecking accept-new\n' \
            > /home/builder/.ssh/config
          chmod 600 /home/builder/.ssh/config
          chown builder:builder /home/builder/.ssh/config
      - name: Publish generated PKGBUILD
        run: |
          # Variables in this command body intentionally expand in builder's shell.
          # shellcheck disable=SC2016
          su builder -c '
            set -e
            cd ~
            curl -fL -o PKGBUILD "https://github.com/coveninja/cove/releases/download/${{ github.ref_name }}/PKGBUILD"
            git clone ssh://aur@aur.archlinux.org/cove-bin.git aur-repo
            cp PKGBUILD aur-repo/
            cd aur-repo
            makepkg --printsrcinfo > .SRCINFO
            git config user.name coveninja-bot
            git config user.email actions@github.com
            git add PKGBUILD .SRCINFO
            git diff --cached --quiet && exit 0
            git commit -m "Update to ${{ github.ref_name }}"
            for attempt in 1 2 3 4 5; do
              git push origin master && exit 0
              test "$attempt" = 5 && exit 1
              sleep 15
            done
          '
