name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Create the GitHub release up front with the tagged commit's body (the MSG
  # + linked commit list that `make patch`/`minor`/`major` writes) as the
  # release notes — the markdown only renders on the release page, and the
  # softprops asset-upload steps otherwise create a body-less release. If a
  # package job wins the race and creates the release first, fall back to
  # editing the notes in. softprops preserves an existing body when no body
  # input is given, so later asset uploads don't clobber the notes.
  create-release:
    name: Create release with notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, go, web, qt]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Seed release notes from the tagged commit body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git log -1 --format=%b > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md \
            || gh release edit "$TAG" --notes-file notes.md

  test:
    name: Full tagged Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COVE_PRIVATE_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test public implementation
        run: go test -count=1 ./...

      - name: Verify and inject private implementations
        run: |
          bash scripts/check-private-sync.sh
          cp _private/cove-auth/*.go internal/supabase/
          cp _private/cove-discover/*.go internal/discover/

      - name: Test release implementation
        run: go test -count=1 -tags supabase,discover ./...

  go:
    name: Go build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COVE_PRIVATE_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Inject private implementations
        shell: bash
        run: |
          cp _private/cove-auth/*.go internal/supabase/
          cp _private/cove-discover/*.go internal/discover/

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -tags supabase,discover -ldflags "-X main.Version=${{ github.ref_name }} -X main.TmdbApiKey=${{ secrets.TMDB_API_KEY }} -X main.SupabaseURL=${{ secrets.SUPABASE_URL }} -X main.SupabaseAnonKey=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} -X main.TraktClientID=${{ secrets.TRAKT_CLIENT_ID }} -X main.TraktClientSecret=${{ secrets.TRAKT_CLIENT_SECRET }}" -o cove .

      - name: Vet
        run: go vet -tags supabase,discover ./...

  web:
    name: Web build + typecheck
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  qt:
    name: Qt shell build (Linux)
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 + mpv + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-webengine-dev \
            qt6-webchannel-dev \
            libmpv-dev

      - name: Configure
        run: cmake -S qt -B qt/build -G Ninja

      - name: Build
        run: cmake --build qt/build

  package:
    name: Package release asset (Flatpak)
    needs: [test, go, web, create-release]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COVE_PRIVATE_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Build Go backend and web frontend outside the Flatpak sandbox (both
      # require network/tools not available inside it). The Flatpak manifest
      # picks them up via the type:dir source and copies them into /app.
      # The Qt shell is also built here for the PKGBUILD tarball.
      - name: Install Qt6 + mpv build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-webengine-dev \
            qt6-webchannel-dev libmpv-dev

      - name: Inject private implementations
        run: |
          cp _private/cove-auth/*.go internal/supabase/
          cp _private/cove-discover/*.go internal/discover/

      - name: Build Go backend
        env:
          CGO_ENABLED: '0'
        run: go build -tags supabase,discover -ldflags "-X main.Version=${{ github.ref_name }} -X main.TmdbApiKey=${{ secrets.TMDB_API_KEY }} -X main.SupabaseURL=${{ secrets.SUPABASE_URL }} -X main.SupabaseAnonKey=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} -X main.TraktClientID=${{ secrets.TRAKT_CLIENT_ID }} -X main.TraktClientSecret=${{ secrets.TRAKT_CLIENT_SECRET }}" -o cove .

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build web frontend
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Build Qt shell (native, for PKGBUILD tarball)
        run: |
          cmake -S qt -B qt/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build qt/build

      - name: Assemble PKGBUILD tarball
        run: |
          mkdir -p _pkg/bin _pkg/lib/cove _pkg/share/cove \
                   _pkg/share/applications \
                   "_pkg/share/icons/hicolor/scalable/apps"

          # Launcher — uses system paths, no QTWEBENGINEPROCESS_PATH needed
          printf '#!/bin/sh\nexec /usr/lib/cove/cove_shell --backend /usr/lib/cove/cove --webroot /usr/share/cove/web "$@"\n' \
            > _pkg/bin/cove
          chmod +x _pkg/bin/cove

          cp cove                   _pkg/lib/cove/cove
          cp qt/build/cove_shell    _pkg/lib/cove/cove_shell
          cp -r web/dist            _pkg/share/cove/web
          cp flatpak/io.github.coveninja.Cove.desktop \
             _pkg/share/applications/
          cp web/src/assets/CoveIcon.svg \
             "_pkg/share/icons/hicolor/scalable/apps/io.github.coveninja.Cove.svg"

          tar -czf cove-linux-amd64.tar.gz -C _pkg .

      - name: Generate PKGBUILD
        run: |
          PKG_VER="${{ github.ref_name }}"
          PKG_VER="${PKG_VER#v}"
          SHA256=$(sha256sum cove-linux-amd64.tar.gz | cut -d' ' -f1)
          sed -e "s/__VERSION__/${PKG_VER}/" \
              -e "s/__SHA256__/${SHA256}/" \
              packaging/PKGBUILD > PKGBUILD
          printf '%s  cove-linux-amd64.tar.gz' "$SHA256" > cove-linux-amd64.tar.gz.sha256

      - name: Install Flatpak build tools and runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y --noninteractive flathub \
            org.kde.Sdk//6.9 \
            org.kde.Platform//6.9 \
            io.qt.qtwebengine.BaseApp//6.9

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: cove-linux-amd64.flatpak
          manifest-path: flatpak/io.github.coveninja.Cove.yml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.coveninja.Cove.yml') }}
          upload-artifact: false

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cove-linux-amd64.flatpak
            cove-linux-amd64.tar.gz
            cove-linux-amd64.tar.gz.sha256
            PKGBUILD

  aur-publish:
    name: Publish to AUR
    needs: [package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Arch container gives us makepkg (for --printsrcinfo) without hand-rolling
    # pacman setup on a plain ubuntu runner.
    container: archlinux:base
    steps:
      - name: Install git, openssh, base-devel, create builder user
        run: |
          pacman -Sy --noconfirm git openssh base-devel
          # base-devel's makepkg refuses to run as root; do everything below
          # as an unprivileged user, matching normal Arch usage. Setting up
          # SSH directly in its home dir (rather than as root and copying
          # over) avoids ownership/ordering pitfalls that broke host key
          # verification.
          useradd -m builder

      - name: Set up SSH for AUR (as builder)
        run: |
          install -d -m 700 -o builder -g builder /home/builder/.ssh

          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          chown builder:builder /home/builder/.ssh/aur

          ssh-keyscan -H aur.archlinux.org >> /home/builder/.ssh/known_hosts
          chmod 600 /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/known_hosts

          cat >> /home/builder/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 /home/builder/.ssh/config
          chown builder:builder /home/builder/.ssh/config

      - name: Download generated PKGBUILD from this release, push to AUR (as builder)
        run: |
          # Variables in this command body intentionally expand in builder's shell.
          # shellcheck disable=SC2016
          su builder -c '
            set -e
            cd ~
            curl -L -o PKGBUILD \
              "https://github.com/coveninja/cove/releases/download/${{ github.ref_name }}/PKGBUILD"
            git clone ssh://aur@aur.archlinux.org/cove-bin.git aur-repo
            cp PKGBUILD aur-repo/
            cd aur-repo
            makepkg --printsrcinfo > .SRCINFO
            git config user.name "coveninja-bot"
            git config user.email "actions@github.com"
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo "No changes to push"
            else
              git commit -m "Update to ${{ github.ref_name }}"
              # The AUR SSH endpoint intermittently drops the connection
              # mid-handshake (unrelated to auth/config); retry a few times
              # before failing the job.
              for attempt in 1 2 3 4 5; do
                if git push origin master; then
                  break
                fi
                echo "push attempt $attempt failed, retrying in 15s..."
                sleep 15
                if [ "$attempt" = 5 ]; then
                  echo "git push failed after 5 attempts"
                  exit 1
                fi
              done
            fi
          '

  package-windows:
    name: Package release asset (Windows)
    needs: [test, go, web, create-release]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COVE_PRIVATE_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Set up MSVC toolchain — required for Qt WebEngine and to run dumpbin/lib
      # to generate an MSVC-compatible mpv.lib from the shinchiro DLL.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: windows
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning

      - name: Download mpv-dev SDK (shinchiro)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest)
          ASSET_URL=$(echo "$RESPONSE" \
            | jq -r '.assets[] | select(.name | test("mpv-dev-x86_64.*\\.7z$")) | .browser_download_url' \
            | head -1)
          if [ -z "$ASSET_URL" ]; then
            echo "Failed to find asset; API response:"
            echo "$RESPONSE" | head -c 500
            exit 1
          fi
          echo "Downloading $ASSET_URL"
          curl -L "$ASSET_URL" -o mpv-dev.7z
          7z x mpv-dev.7z -ompv-sdk -y

      # The shinchiro dev package ships libmpv.dll.a (MinGW format), which MSVC
      # can't link against. Locate the DLL (handles flat and nested archives),
      # generate a proper mpv.lib from its exports, and export MPV_SDK for CMake.
      - name: Generate MSVC import library for mpv
        shell: pwsh
        run: |
          $dll = Get-ChildItem mpv-sdk -Filter "mpv-2.dll" -Recurse | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem mpv-sdk -Filter "libmpv-2.dll" -Recurse | Select-Object -First 1 }
          $dir = $dll.DirectoryName
          Write-Host "mpv root: $dir"
          # Export for subsequent CMake and staging steps
          "MPV_SDK=$dir"     | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MPV_DLL=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Generating mpv.lib from $($dll.FullName)"
          $lines = dumpbin /exports $dll.FullName
          $funcs = $lines | Where-Object { $_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\w+)' } |
                   ForEach-Object { [regex]::Match($_, '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\w+)').Groups[1].Value }
          Set-Content "$dir\mpv.def" -Value (@("LIBRARY mpv-2.dll", "EXPORTS") + $funcs) -Encoding ASCII
          lib /def:"$dir\mpv.def" /machine:x64 /out:"$dir\mpv.lib"
          Write-Host "Done: $dir\mpv.lib"

      - name: Inject private implementations
        shell: bash
        run: |
          cp _private/cove-auth/*.go internal/supabase/
          cp _private/cove-discover/*.go internal/discover/

      - name: Build Go backend (Windows)
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -tags supabase,discover -ldflags "-X main.Version=${{ github.ref_name }} -X main.TmdbApiKey=${{ secrets.TMDB_API_KEY }} -X main.SupabaseURL=${{ secrets.SUPABASE_URL }} -X main.SupabaseAnonKey=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} -X main.TraktClientID=${{ secrets.TRAKT_CLIENT_ID }} -X main.TraktClientSecret=${{ secrets.TRAKT_CLIENT_SECRET }}" -o cove.exe .

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build web frontend
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Build Qt shell (Windows/MSVC)
        shell: cmd
        run: |
          cmake -S qt -B qt/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build qt/build

      - name: Assemble staging directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging/web | Out-Null
          Copy-Item cove.exe staging/
          Copy-Item qt/build/cove_shell.exe staging/
          # MPV_DLL was set by the Generate MSVC import library step
          Copy-Item "${{ env.MPV_DLL }}" staging/mpv-2.dll
          Copy-Item -Recurse web/dist/* staging/web/

      - name: Bundle Qt runtime (windeployqt)
        shell: pwsh
        run: |
          # Run windeployqt against the *staged* exe so its entire output
          # (Qt DLLs, plugin dirs, qml/, resources/, translations/,
          # QtWebEngineProcess.exe) lands in the package directly.
          # Cherry-picking files out of qt/build instead has silently dropped
          # required pieces (qml/, QtWebEngineProcess.exe) and shipped Windows
          # builds that open a dead window.
          windeployqt --qmldir qt/qml staging/cove_shell.exe

          # windeployqt's --compiler-runtime deploys the vc_redist.x64.exe
          # *installer* for MSVC builds, not the runtime DLLs, so copy the CRT
          # DLLs (vcruntime140*.dll, msvcp140*.dll) from the MSVC toolchain's
          # redist dir ourselves. VCToolsRedistDir is exported by
          # ilammy/msvc-dev-cmd.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) {
            Write-Error "MSVC CRT redist dir not found under $env:VCToolsRedistDir\x64"
            exit 1
          }
          Copy-Item "$($crt.FullName)\*.dll" staging/

      - name: Sanity-check staged package
        shell: pwsh
        run: |
          $missing = @()
          # opengl32sw.dll: cove_shell forces Qt Quick onto the OpenGL RHI
          # (main.cpp — mpv only implements OpenGL rendering), so Qt's bundled
          # Mesa software rasterizer is the only fallback on machines with a
          # missing/broken GPU driver.
          # QtWebEngineProcess.exe: the Chromium renderer — without it the
          # WebEngineView silently renders nothing.
          # vcruntime140.dll / msvcp140.dll: copied from VCToolsRedistDir;
          # without them a machine lacking the VC++ redist can't start
          # cove_shell.exe at all.
          foreach ($f in @("opengl32sw.dll", "QtWebEngineProcess.exe", "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            if (-not (Test-Path "staging/$f")) { $missing += $f }
          }
          # qml/: the QML modules main.qml imports; without them the shell
          # runs but never creates a window.
          if (-not (Test-Path "staging/qml/QtQuick")) { $missing += "qml/QtQuick/" }
          if (-not (Get-ChildItem "staging/resources" -Filter "*.pak" -ErrorAction SilentlyContinue)) { $missing += "resources/*.pak" }
          if ($missing) {
            Write-Error ("Staged Windows package is incomplete — missing: " + ($missing -join ", "))
            exit 1
          }

      - name: Create zip (for auto-updater)
        shell: pwsh
        run: |
          Compress-Archive -Path staging/* -DestinationPath cove-windows-amd64.zip

      # The auto-updater downloads this alongside the zip and refuses to
      # extract an archive whose SHA-256 doesn't match (see internal/updater).
      - name: Publish zip checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash cove-windows-amd64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  cove-windows-amd64.zip" | Out-File cove-windows-amd64.zip.sha256 -Encoding ascii -NoNewline

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create NSIS installer
        shell: pwsh
        run: |
          makensis /DVERSION="${{ github.ref_name }}" /DOUTDIR="${{ github.workspace }}" packaging/windows/cove.nsi

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cove-windows-amd64-setup.exe
            cove-windows-amd64.zip
            cove-windows-amd64.zip.sha256

  package-android:
    name: Package release asset (Android)
    needs: [test, go, web, create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.COVE_PRIVATE_TOKEN }}

      # Fail fast with a clear message instead of a cryptic Gradle signing
      # error at the end of a long build. See android/README.md for the
      # one-time keystore generation and secret setup.
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot sign the release APK. See android/README.md (Release signing)."
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The wrapper jar is not committed; install the same Gradle the wrapper
      # pins (android/gradle/wrapper/gradle-wrapper.properties — keep in sync).
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      # Runners preinstall the Android SDK at $ANDROID_HOME; the Makefile's
      # `?=` assignments pick it up. Only the pinned NDK needs installing.
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - name: Inject private implementations
        run: |
          cp _private/cove-auth/*.go internal/supabase/
          cp _private/cove-discover/*.go internal/discover/

      # gomobile/gobind versions are kept in lockstep with the go.mod
      # requirement. gomobile looks up the gobind BINARY on PATH (the go.mod
      # tool directive is not enough), and `gomobile init` needs the NDK.
      - name: Install gomobile
        run: |
          MOBILE_VERSION=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@"$MOBILE_VERSION"
          go install golang.org/x/mobile/cmd/gobind@"$MOBILE_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          gomobile init

      # `make android-aar` embeds web/dist into the AAR (-tags embedweb), so
      # the frontend must be installable and buildable here too.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      # `make android-aar` composes -tags supabase,discover automatically once
      # the private implementations above are present, mirroring desktop builds.
      # It runs `make web` first; pass the same Vite env the desktop web builds use.
      - name: Build Go backend AAR (gomobile)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: make android-aar

      # Android reads runtime secrets from local.properties → BuildConfig
      # (see android/app/build.gradle.kts), unlike the desktop's ldflags path.
      - name: Write local.properties
        run: |
          cat > android/local.properties <<EOF
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          EOF

      # tr strips whitespace/CR that sneaks in when the base64 is pasted into
      # the secret box (strict `base64 -d` rejects it); the magic-byte check
      # turns "wrong secret content" into a readable error instead of a
      # signing failure at the end of the build.
      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          CLEAN=$(printf '%s' "$KS_B64" | tr -d ' \t\r\n')
          LEN=${#CLEAN}
          # Diagnostics only — never prints secret content. A 4096-bit RSA JKS
          # encodes to roughly 3500-6000 chars; length mod 4 must be 0.
          echo "keystore secret: $LEN chars after whitespace cleanup (mod 4 = $((LEN % 4)))"
          if [ "$LEN" -eq 0 ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          if ! printf '%s' "$CLEAN" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$'; then
            echo "::error::ANDROID_KEYSTORE_BASE64 contains non-base64 characters. Re-set it without copy-paste: base64 -w0 cove-release.jks | gh secret set ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [ $((LEN % 4)) -ne 0 ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 length is not a multiple of 4 — the base64 was truncated when it was copied. Re-set it without copy-paste: base64 -w0 cove-release.jks | gh secret set ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/cove-release.jks"
          MAGIC=$(head -c 4 "$RUNNER_TEMP/cove-release.jks" | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feedfeed|3082*) ;;  # JKS / PKCS#12
            *)
              echo "::error::ANDROID_KEYSTORE_BASE64 decoded, but the result is not a JKS/PKCS12 keystore (first bytes: ${MAGIC:-empty}). The secret holds the wrong content — re-set it with: base64 -w0 cove-release.jks | gh secret set ANDROID_KEYSTORE_BASE64"
              exit 1
              ;;
          esac

      - name: Build release APK
        working-directory: android
        env:
          COVE_VERSION: ${{ github.ref_name }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/cove-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle lintDebug testDebugUnitTest assembleRelease

      - name: Stage APK + checksum
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cove-android.apk
          sha256sum cove-android.apk > cove-android.apk.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cove-android.apk
            cove-android.apk.sha256
