version: 2
updates:
  - package-ecosystem: gradle
    directory: /app
    schedule:
      interval: weekly
    groups:
      kotlin-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
